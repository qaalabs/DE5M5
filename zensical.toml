[project.theme]
variant = "classic"

features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "toc.integrate",

  #"content.action.edit",
  #"content.action.view",
  #"header.autohide",
  #"navigation.expand",
  #"navigation.footer",
  #"navigation.instant",
  #"navigation.instant.prefetch",
  #"navigation.instant.progress",
  #"navigation.path",
  #"navigation.sections",
  #"navigation.tabs",
  #"navigation.tabs.sticky",
  #"navigation.top",
  #"navigation.tracking",
  #"search.highlight",
  #"toc.follow",
]
    
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
    
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
    
[project.theme.icon]
logo = "material/database"
    
