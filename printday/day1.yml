# Site name
site_name: M5 - Data Engineering Product Development
use_directory_urls: false
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - "Day 1 ~ Foundation & Setup":
    - "Library pipeline scenario": day1/scenario.md
    - "Library pipeline sample data": day1/sample-data.md
    - "Your mission": day1/your-mission.md
    - "Creating architecture diagrams": day1/create-diagram.md
    - "👥 Design your pipeline architecture": day1/design-pipeline.md
    - "Writeup architecture decision record": day1/adr.md
    - "Create a GitHub repository": day1/create-repo.md
    - "Introduce GitHub projects": day1/create-project.md
    - "Set up kanban board": day1/project-tasks.md
    - "Clone library pipeline repo": day1/clone-repo.md
    - "Setup development environment": day1/python-setup.md
    - "Replace template placeholders": day1/placeholders.md
    - "Production readiness check": labs/yardstick.md

# Theme
theme:
    name: material

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - print-site:
      enumerate_headings: false
      add_table_of_contents: false
      add_cover_page: true
      cover_page_template: printday_cover.tpl

