# Site name
site_name: M5 - Data Engineering Product Development
use_directory_urls: false
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - "Day 3 ~ Automation & Integration":
    - "GitHub Actions - Trigger workflow": day3/github-workflow.md
    - "Explore GitHub history & logs": day3/github-explore.md
    - "Python meets SQL Server": day3/python-sql.md
    - "Run the pipeline runner": day3/pipeline-runner.md
    - "Create database in SSMS": day3/ssms.md
    - "Run PowerBi in the VM": day3/vm-powerbi.md
    - "Start the QA Fabric playground": https://qaalabs.github.io/fabric/run-inside-vm/
    - "01 Create Fabric lakehouse": labs/32-lakehouse.md
    - "Run pipeline in MS Fabric": labs/33-library-pipeline.md
    - "Create gold layer table": labs/33-library-pipeline.md

# Theme
theme:
    name: material

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - print-site:
      enumerate_headings: false
      add_table_of_contents: false
      add_cover_page: true
      cover_page_template: printday_cover.tpl

