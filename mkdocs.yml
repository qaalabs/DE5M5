  - Module KSBs: ksb.md

  - Agenda:
    - Topics: agenda/index.md
    - Day 1: agenda/day1.md

  - "Day 1 ~ Foundation & Setup":
    - "Library Pipeline Scenario": day1/scenario.md
    - "Library Pipeline Sample Data": day1/sample-data.md
    - "Your Mission": day1/your-mission.md
    - "Creating Architecture Diagrams": day1/create-diagram.md
    - "Design your pipeline architecture": day1/design-pipeline.md
    - "Writeup Architecture Decision Record": day1/adr.md
    - "Create a GitHub repository": day1/create-repo.md
    - "Introduce GitHub Projects": day1/create-project.md
    - "Set up Kanban Board": day1/project-tasks.md
    - "Clone Library Pipeline Repo": day1/clone-repo.md
    - "Create local development env": day1/dev-environment.md
