# Site name
site_name: M5 - Data Engineering Product Development
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - Overview: index.md
  - Module KSBs: ksb.md

  - Agenda:
    - Topics: agenda/index.md
    - Day 4: agenda/day4.md

  - "Day 4 ~ Orchestrate & Present":
    - "Start QA MS Fabric Platform": labs/41-fabric-setup.md
    - "Lab: Run MS Fabric Pipeline": labs/42-fabric-pipeline.md
    - "Lab: Build MkDocs Site": labs/43-mkdocs-site.md
    - "Introduce Presentation Task": day4/presentations.md

  - Resources: resources.md

not_in_nav: |
  404.md
  trainer.md
  DAY-setup.md
  day1/prod-ready.md
  day1/review-diagram.md
  day1/github-template.md
  day1/dev-commit.md
  labs/40-setup.md
  umfundi.md
  day2/validation-solution.md
  day2/cleaning-tests-solution.md


# Theme
theme:
    features:
      - toc.integrate
      - content.code.copy
    name: material
    icon:
      logo: material/database

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - glightbox
  - mkdocs_quiz

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js


